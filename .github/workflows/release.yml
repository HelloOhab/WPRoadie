name: Release

# Publishes a GitHub release with wproadie.zip. Sites update from it
# through WPRoadie's built-in updater. Either:
#   - push a tag like v0.2.0, or
#   - run this workflow by hand (Actions → Release → Run workflow) on main
#     with the version; it creates the tag on the commit it runs on.
# The version must match the Version header and WPROADIE_VERSION in
# wproadie.php.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (no leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Work out the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
              echo "Version must look like 1.2.3, got: $INPUT_VERSION"; exit 1
            fi
            echo "TAG=v$INPUT_VERSION" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Check the tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' wproadie.php | tr -d '[:space:]')"
          constant="$(sed -n "s/^define( 'WPROADIE_VERSION', '\(.*\)' );/\1/p" wproadie.php)"
          tag="${TAG#v}"
          if [ "$version" != "$tag" ] || [ "$constant" != "$tag" ]; then
            echo "Tag $tag does not match header $version / constant $constant"; exit 1
          fi
      - run: npm ci
      - run: bash bin/build-zip.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag on this commit when it does not exist yet
        # (the hand-run case); for a pushed tag it is already there.
        run: gh release create "$TAG" dist/wproadie.zip --target "$GITHUB_SHA" --title "WPRoadie $TAG" --generate-notes
