name: Release

# Push a tag like v0.2.0 (matching the Version header in wproadie.php) to
# publish a GitHub release with wproadie.zip. Sites update from it through
# WPRoadie's built-in updater.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the plugin version
        run: |
          version="$(sed -n 's/^ \* Version: *//p' wproadie.php | tr -d '[:space:]')"
          constant="$(sed -n "s/^define( 'WPROADIE_VERSION', '\(.*\)' );/\1/p" wproadie.php)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ] || [ "$constant" != "$tag" ]; then
            echo "Tag $tag does not match header $version / constant $constant"; exit 1
          fi
      - run: npm ci
      - run: bash bin/build-zip.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/wproadie.zip --title "WPRoadie $GITHUB_REF_NAME" --generate-notes
